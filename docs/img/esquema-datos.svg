<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Esquema preliminar de datos de Presupuestando</title>
  <desc id="desc">Tres colecciones MongoDB relacionadas: un usuario tiene muchos presupuestos y tickets; cada ticket pertenece a un presupuesto. Los conceptos están embebidos en el presupuesto. Se indican índices, importes en céntimos y hash del token público.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 25px; font-weight: 700; }
      .head { font-size: 19px; font-weight: 700; }
      .field { font-size: 15px; }
      .note { font-size: 14px; fill: #334155; }
      .box { fill: #f8fafc; stroke: #475569; stroke-width: 2; rx: 12; }
      .relation { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="690" fill="#fff"/>
  <text x="600" y="42" text-anchor="middle" class="title">Esquema preliminar · MongoDB Atlas</text>

  <rect x="45" y="105" width="330" height="290" class="box"/>
  <text x="210" y="140" text-anchor="middle" class="head">usuarios</text>
  <text x="70" y="181" class="field">_id: ObjectId</text>
  <text x="70" y="211" class="field">email: String · índice único</text>
  <text x="70" y="241" class="field">password_hash: String · bcrypt</text>
  <text x="70" y="271" class="field">nombre_fiscal: String</text>
  <text x="70" y="301" class="field">telefono: String</text>
  <text x="70" y="354" class="note">No se persiste el JWT de sesión</text>
  <text x="70" y="377" class="note">en esta colección.</text>

  <rect x="430" y="78" width="440" height="405" class="box"/>
  <text x="650" y="114" text-anchor="middle" class="head">presupuestos</text>
  <text x="458" y="153" class="field">_id: ObjectId</text>
  <text x="458" y="181" class="field">usuario_id: ObjectId → usuarios._id</text>
  <text x="458" y="209" class="field">cliente_nombre: String</text>
  <text x="458" y="237" class="field">cliente_telefono: String opcional</text>
  <text x="458" y="265" class="field">conceptos: [{descripcion, cantidad,</text>
  <text x="458" y="289" class="field">  precio_unitario_centimos}] embebidos</text>
  <text x="458" y="317" class="field">total_centimos: Integer</text>
  <text x="458" y="345" class="field">estado: Borrador | Pendiente (MVP)</text>
  <text x="458" y="373" class="field">token_acceso_hash: String · único</text>
  <text x="458" y="401" class="field">expira_en, fecha_creacion: Date</text>
  <text x="458" y="449" class="note">Índice por usuario_id + fecha_creacion.</text>

  <rect x="925" y="130" width="235" height="300" class="box"/>
  <text x="1042" y="166" text-anchor="middle" class="head">tickets</text>
  <text x="948" y="207" class="field">_id: ObjectId</text>
  <text x="948" y="239" class="field">usuario_id: ObjectId</text>
  <text x="948" y="271" class="field">presupuesto_id:</text>
  <text x="948" y="295" class="field">  ObjectId</text>
  <text x="948" y="327" class="field">url_imagen: String</text>
  <text x="948" y="359" class="field">fecha_subida: Date</text>
  <text x="948" y="399" class="note">No hay importe en MVP.</text>

  <path d="M375 210H430" class="relation"/>
  <text x="402" y="194" text-anchor="middle" class="note">1 → N</text>
  <path d="M870 265H925" class="relation"/>
  <text x="897" y="249" text-anchor="middle" class="note">1 → N</text>
  <path d="M375 335C620 535 790 535 925 385" class="relation"/>
  <text x="675" y="535" text-anchor="middle" class="note">propiedad del ticket (usuario_id)</text>

  <rect x="45" y="575" width="1115" height="80" class="box"/>
  <text x="68" y="609" class="note">Los conceptos se embeben porque se crean y consultan con el presupuesto. Las relaciones se guardan como referencias;</text>
  <text x="68" y="634" class="note">el servidor verifica la propiedad del usuario. Los importes se almacenan en céntimos para evitar coma flotante.</text>
</svg>
